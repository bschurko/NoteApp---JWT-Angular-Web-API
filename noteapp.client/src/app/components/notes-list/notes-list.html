<div class="d-flex justify-content-start">
  <div class="p-2">
   
    <div class="list-group" id="list-tab" role="tablist">
      <a *ngFor="let note of notes" class="list-group-item list-group-item-action" id="list-home-list" data-bs-toggle="list" href="#"   role="tab" (click)="onNoteClicked(note)" [ngClass]="{ 'active': activeLinkId === note.id }" 
          aria-controls="list-home">{{note.title}}</a>
    </div>
     
  </div>
  <div class="p-2">
    <app-edit-notes></app-edit-notes>
  </div>
</div>
